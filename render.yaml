services:
  - type: web
    name: ledger-agent-kernel
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: LEDGER_OFFLINE_STUB
        value: "1"
      - key: LEDGER_CORS_ORIGINS
        sync: false
      - key: BIFROST_URL
        sync: false
      - key: BIFROST_VK
        sync: false
      - key: TAVILY_API_KEY
        sync: false
