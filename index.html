<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#e6ecef;--paper:#fbfcfc;--ink:#17232c;--mute:#5d6f7a;--rule:#c4d3d9;--ok:#1b6b49;--no:#b3261e;--blue:#1d4fb8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Public Sans",system-ui,sans-serif}
header{padding:18px 28px;display:flex;gap:16px;align-items:baseline;border-bottom:1px solid var(--rule)}
h1{font:600 28px "Newsreader",Georgia,serif;margin:0}.tag{color:var(--mute);font-size:13px}
.badge{margin-left:auto;font-size:12px;border:1px solid var(--rule);padding:2px 10px;border-radius:99px;background:var(--paper)}
main{display:grid;grid-template-columns:280px 1fr;gap:24px;padding:24px 28px;max-width:1180px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
aside{display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.tabs button{flex:1;padding:8px;border:0;background:none;font:inherit;cursor:pointer}.tabs .on{background:var(--ink);color:#fff}
label{font-size:13px;color:var(--mute);display:block}input{width:100%;padding:8px;border:1px solid var(--rule);border-radius:4px;font:inherit;background:var(--paper)}
.run{padding:10px;background:var(--blue);color:#fff;border:0;border-radius:6px;font:600 15px inherit;cursor:pointer}.run:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sheet{background:var(--paper) repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px);border:1px solid var(--rule);border-left:3px solid var(--no);padding:24px 28px;min-height:420px;line-height:28px}
.sheet h2{font:600 24px/32px "Newsreader",Georgia,serif;margin:0 0 4px}.sheet h3{font:600 16px/28px "Public Sans";margin:28px 0 0}
.sheet p,.sheet li{margin:0}ul{padding-left:18px;margin:0}sup{color:var(--blue);font-weight:600}
.q{font-style:italic;color:var(--mute)}.stamp{display:inline-block;font-weight:600;font-size:12px;line-height:18px;padding:0 8px;border:1.5px solid;border-radius:3px;margin-right:8px}
.pass{color:var(--ok)}.fail{color:var(--no)}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td{padding:0 6px 0 0;vertical-align:top}td:last-child{text-align:right}
.bar{height:14px;background:var(--rule);margin:2px 0}.bar i{display:block;height:100%;background:var(--ink)}.bar.b i{background:var(--no)}
pre{margin:0;font:13px/22px ui-monospace,monospace;background:#0000000a;padding:0 8px}.empty{color:var(--mute)}
</style></head><body>
<header><h1>Ledger</h1><span class="tag">Cheaper agents. Stronger evidence.</span><span class="badge" id="st">checking…</span></header>
<main><aside>
<div class="tabs" role="tablist"><button id="tb" class="on">Brief</button><button id="tf">Fix</button></div>
<div id="fb"><label for="co">Company or person</label><input id="co" value="Acme Robotics"><label for="mt" style="margin-top:8px">Meeting time</label><input id="mt" value="Thu 3pm"></div>
<div><label for="cap">Token budget</label><input id="cap" type="number" value="12000" step="1000"></div>
<button class="run" id="go">Build brief</button>
<p class="tag" id="hint">Ledger checks cheaply before spending: verified claims in Brief, focused test-driven edits in Fix. Offline replay uses bundled sources and a stub model.</p>
</aside><section class="sheet" id="out"><p class="empty">Run a brief to see sourced claims, rejected claims and the token receipt.</p></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let mode="brief";
function setMode(m){mode=m;$("tb").className=m=="brief"?"on":"";$("tf").className=m=="fix"?"on":"";$("fb").hidden=m=="fix";$("go").textContent=m=="brief"?"Build brief":"Fix failing tests";$("cap").value=m=="brief"?12000:6000}
$("tb").onclick=()=>setMode("brief");$("tf").onclick=()=>setMode("fix");
fetch("/api/status").then(r=>r.json()).then(s=>$("st").textContent=(s.bifrost||s.tavily)?"live: "+[s.bifrost&&"Bifrost",s.tavily&&"Tavily"].filter(Boolean).join(" + "):"offline replay").catch(()=>$("st").textContent="backend not reachable");
const bars=r=>{const w=Math.min(100,r.receipt.tokens/r.baseline_tokens*100);return `<h3>Token receipt</h3><table>${r.receipt.calls.map(c=>`<tr><td>${esc(c.label)} (${c.tier})</td><td>${c.in+c.out} tok</td></tr>`).join("")}<tr><td><b>Ledger total</b></td><td><b>${r.receipt.tokens} tok · $${r.receipt.usd}</b></td></tr></table>
<div class="bar"><i style="width:${w}%"></i></div><div class="bar b"><i style="width:100%"></i></div><p class="tag" style="line-height:20px">Black: Ledger. Red: ungated baseline estimate (${r.baseline_tokens} tok, all text to the strong model). Prices are placeholders.</p>`};
function brief(r){const a=r.audit;return `<h2>${esc(r.company)}</h2><p class="tag">Brief for ${esc(r.meeting)} · window ${r.window[0]} to ${r.window[1]}</p>
<h3>Last 30 days</h3><ul>${r.bullets.map(b=>`<li>${esc(b.text)}${b.cites.map(c=>`<sup>${c}</sup>`).join("")}</li>`).join("")||"<li class=empty>No claim passed the gate, so no synthesis call was made.</li>"}</ul>
<h3>Open questions</h3><ul>${r.open_questions.map(q=>`<li class="q">${esc(q)}</li>`).join("")}</ul>
<h3>Sources</h3><table>${r.sources.map(s=>`<tr><td><sup>${s.n}</sup> <a href="${esc(s.url)}">${esc(s.title)}</a></td><td>${s.date}</td></tr>`).join("")}</table>
<h3>Verification audit</h3><p><span class="stamp pass">${a.accepted} passed</span><span class="stamp fail">${a.rejected.length} rejected</span><span class="stamp fail">${a.pre_dropped.length} sources dropped</span></p>
<table>${a.rejected.map(x=>`<tr><td>${esc(x.claim)}</td><td class="fail">${esc(x.reason)}</td></tr>`).join("")}${a.pre_dropped.map(x=>`<tr><td>${esc(x.title)}</td><td class="fail">${esc(x.reason)}</td></tr>`).join("")}</table>
${bars(r)}<p>Cost per verified claim: <b>$${r.cost_per_verified}</b></p>`}
function fix(r){return `<h2>Fix mode</h2><p><span class="stamp ${r.status=="green"?"pass":"fail"}">${r.status}</span></p>
<table>${r.steps.map(s=>`<tr><td><span class="${s.ok?"pass":"fail"}">${s.ok?"✓":"✗"}</span> ${esc(s.step)}</td><td style="text-align:left">${esc(s.detail)}</td></tr>`).join("")}</table>
${(r.diff||[]).map(d=>`<h3>Edit</h3><pre class="fail">- ${esc(d.old.trim())}</pre><pre class="pass">+ ${esc(d.new.trim())}</pre>`).join("")}${r.baseline_tokens?bars(r):""}`}
$("go").onclick=async()=>{$("out").innerHTML='<p class="empty">Running…</p>';$("go").disabled=true;
 try{const response=await fetch("/api/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({company:$("co").value,meeting:$("mt").value,cap:+$("cap").value})});
 const r=await response.json();if(!response.ok){const detail=Array.isArray(r.detail)?r.detail.map(x=>x.msg).join("; "):r.detail||"Request failed";throw new Error(detail)}
 $("out").innerHTML=mode=="brief"?brief(r):fix(r)}catch(e){$("out").innerHTML=`<p class="fail">Request failed: ${esc(e.message)}</p>`}finally{$("go").disabled=false}};
</script></body></html>
